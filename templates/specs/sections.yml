# TADForce section specifications.
# One entry per `<!-- tad:pending <id> -->` marker of the skeletons. The agent replaces the marker with
# content that satisfies the spec. Specs are written in English; the content is written in the
# document language (tadforce.config.json > language).
#
#   intent   what the reader must understand after reading the section
#   facts    facts.json paths to read first (use {{n:...}} placeholders for every count)
#   modules  skills/tadforce/references/modules/*.md files to read when the module is detected
#   must     elements that must appear
#   never    what must not appear (debt goes to the Improvement Axes document, not to the client TAD)
#   figure   expected figure, if any (see skills/tadforce/references/figure-rules.md)
#   length   indicative size
#   when     optional condition on facts (src/facts/when.js): false → the section is not scaffolded nor asked
#            by `tadforce next` (e.g. "omni.scripts > 0 || modules.experienceCloud"; paths as in {{n:...}})
version: 1

requiredAnchors:
  # an entry is an anchor id, or { id, when } for an appendix that exists only when its family does
  tad: [doc-control, ch-summary, ch-purpose, method, ch-context, ch-general, general-context, ch-functional, ch-data, data-overview, ch-application, ch-ui, ch-integration, ch-security, sec-sharing, ch-reporting, ch-operations, ch-nfr, ch-decisions, ch-outlook, appendices,
    { id: annex-apex, when: "annexes.async.count > 0 || annexes.rest.count > 0" }, { id: annex-automation, when: "apex.triggers > 0 || flows.total > 0" }, annex-objects,
    { id: annex-apps, when: "ui.apps > 0" }, { id: annex-lwc, when: "ui.lwc > 0" }, annex-security,
    { id: annex-integration, when: "annexes.namedCredentials.count > 0 || annexes.externalCredentials.count > 0 || annexes.connectedApps.count > 0 || annexes.authProviders.count > 0 || annexes.allowedDomains.count > 0" }, annex-glossary]
  axes: [doc-control, ax-summary, ax-method, ax-findings, ax-register, ax-roadmap]

sections:
  # ------------------------------------------------------------------ 1 Executive summary
  summary.overview:
    doc: tad
    intent: "In one screen: what the platform is, who uses it and on which Salesforce products it stands."
    facts: [ui.apps, modules.clouds, counts]
    must:
      - "Name the solution and its role in the client's information system (system of engagement, service desk, commerce front-office, partner portal...)."
      - "The user populations and the application each one uses (from ui.apps and glossary.actors)."
      - "The 2 to 5 Salesforce products actually used (modules.clouds), one line each on what they bring to this client."
    never:
      - "Counts written as raw numbers (the KPI tiles below carry them)."
      - "Defects, risks or roadmap items."
    length: "2 short paragraphs and 2 bullet lists."
  summary.capabilities:
    doc: tad
    intent: "The business capabilities covered, grouped by domain."
    facts: [ui.apps, data.objects, automation.flows, systems]
    must:
      - "Table 'Domain | Main capabilities' with one row per domain of the understanding model (model.domains, 5 to 9 rows), each row grounded on components that exist."
    never:
      - "Capabilities that no component supports."
      - "Decommissioned features (knowledge/exclusions.yml > features)."
  summary.achievements:
    doc: tad
    intent: "The 4 to 6 achievements that make this implementation remarkable: what the integrator built, not what Salesforce provides."
    facts: [apex.classes, data.cmdtTypes, automation, security.permissionSetGroups, integration]
    must:
      - "Raw HTML block <div class=\"cards\"> with one <div class=\"card\"><h4>Title</h4><p>2 to 4 sentences</p></div> per achievement."
      - "Each card names the mechanism and its key component in code font, and says why it matters (configurable without code, scales, secure by design...). Pick them from the processes and component cards of the model."
    never:
      - "Marketing superlatives."
      - "Anything not visible in the metadata or in the inputs."
  summary.principles:
    doc: tad
    intent: "The architecture principles actually applied, as a numbered list of 4 to 7 items."
    facts: [modules, counts.apex, data.cmdtTypes, integration.namedCredentials]
    must:
      - "Each principle in bold followed by one sentence of evidence (example: 'Configuration in Custom Metadata: scoring rules and thresholds are records, not code')."

  # ------------------------------------------------------------------ 2 Purpose, scope, references
  purpose.object:
    doc: tad
    intent: "Why this document exists and who reads it."
    must:
      - "Purposes: shared understanding, run and maintenance, evolutions, architecture and security reviews, knowledge transfer."
      - "Audience list (architects, application owners, operations, security, developers)."
    length: "1 paragraph and 1 list."
  purpose.scope:
    doc: tad
    intent: "What is in and out of scope."
    facts: [scope, exclusions.applied, modules.clouds]
    must:
      - "Two-column table 'Included | Excluded'."
      - "Excluded column names the internals of external systems, package internals, business data, and CI/CD administration when the client owns it."
  purpose.references:
    doc: tad
    intent: "Documents used as inputs."
    facts: [knowledge/inputs]
    must:
      - "Table 'Ref. | Document | Purpose' with DR-01, DR-02... identifiers."
      - "Include the official Salesforce documentation relied on (Well-Architected, Integration Patterns, product documentation)."
    never:
      - "Documents that were not provided."

  # ------------------------------------------------------------------ 3 Context
  context.drivers:
    doc: tad
    intent: "The business drivers that justify the platform."
    must:
      - "3 to 6 bullets, each a business outcome (not a feature)."
    never:
      - "Invented figures."
  context.actors:
    doc: tad
    intent: "Who uses the platform and through which application."
    facts: [ui.apps, security.permissionSetGroups, security.profiles, org.usersByProfile, org.usersByLicense]
    must:
      - "Table 'Population | Application | Main activities', one row per actor of the model (model.actors). Users per population only when org facts exist, as placeholders or from the generated tables."
      - "External populations (customers, partners, citizens) when Experience Cloud or a mobile app exists."
  context.scope:
    doc: tad
    intent: "Functional perimeter in one table."
    must:
      - "Table 'Domain | Covered by' with the domains of the model, linking to the chapter 5 sections with {{ref:...}} placeholders."

  # ------------------------------------------------------------------ 4 General architecture
  general.context:
    doc: tad
    intent: "Explain the context view above."
    facts: [systems, integration, ui.apps]
    must:
      - "One paragraph per side of the figure (users, Salesforce, connected systems)."
      - "External systems named exactly as in glossary.systems."
    never:
      - "System names not confirmed in the glossary."
  general.products:
    doc: tad
    intent: "What each Salesforce product, industry cloud or package is used for in this org."
    facts: [modules.clouds, namespaces, org.packages]
    modules: [all detected]
    must:
      - "Table 'Product | Use in the solution', one row per entry of modules.clouds that is really used."
      - "A 'standard first' statement: what is standard, what is specific."
  general.layers:
    doc: tad
    intent: "Explain the layered view and the responsibility of each layer."
    must:
      - "Table 'Layer | Components | Responsibility' (Presentation, Orchestration, Apex services, Data, Integration)."
  general.principles:
    doc: tad
    intent: "Design principles with their concrete application."
    must:
      - "4 to 8 bullets 'principle: how it is applied' (standard first, configuration over code, bulk-safe, secure server-side...)."
  general.naming:
    doc: tad
    intent: "Naming conventions observed in the metadata (table above) and their meaning."
    facts: [naming]
    must:
      - "Interpret the prefixes and suffixes (example: '*TriggerHandler', 'lwcNNN_')."
      - "Where the convention is not followed, state it as a neutral fact."

  # ------------------------------------------------------------------ 5 Functional
  functional.domains:
    doc: tad
    intent: "Map of the functional domains and where each one is described."
    must:
      - "Lead paragraph, then one Mermaid flowchart of the domains of the model (model.domains) with their actors and connected glossary systems (classes actor, sf, ext, data) followed by a Figure caption, then a table 'Domain | Objects | Main components | Section'."
    figure: "One flowchart LR: the functional domain map (domains, actors, systems)."
  functional.processes:
    doc: tad
    intent: "One subsection per key process of the understanding model (model.processes): the end-to-end chain of components, as implemented, so that a reader understands what the org does."
    facts: [data.objects, automation.flows, apex.classes, ui.lwc, automation.omnistudio]
    modules: [all detected]
    must:
      - "One '## <Domain> {#fn-<domainId>}' section per domain of the model that has processes, then one '### <Process name> {#fn-<processId>}' subsection per process of model.processes (every process of the model appears, none is invented)."
      - "Each process subsection, in this order: one paragraph chaining the components end to end (who starts it, each component in code font with what it does, objects written, systems called, asynchronous steps); the figure; a table 'Step | Mechanism' numbered like the figure."
      - "Cloud-specific processes follow the module reference (case management for Service Cloud, quote-to-cash for CPQ/Revenue, appointment lifecycle for Field Service, checkout for Commerce...)."
      - "A figure for every process: '@@SEQ:<processId>@@' for a flow across several components; the '@@STATE:<lifecycleId>@@' this section owns (group figures.own) under a heading '#### <Object> lifecycle {#lc-<lifecycleId>}' in the subsection of its process; never a hand-drawn diagram of a process the model holds."
      - "The business view: who does what and what comes out. The technical mechanism (handlers, order of execution, thresholds) belongs to chapter 7, which links back here."
      - "Optional '> [!INTEGRATOR]' callout for a notable design choice of the integrator."
    never:
      - "Decommissioned features."
      - "Screens or steps not evidenced by metadata or inputs."
      - "Processes, participants or systems that are not in the model; « to be confirmed » or empty subsections (doubts are findings of the model)."
      - "A figure owned by another section (group figures.link): link to it with its {{ref:…}}."
    figure: "One figure per process: @@SEQ:<processId>@@ (sequence, numbered steps), and the @@STATE:<lifecycleId>@@ this section owns."

  # ------------------------------------------------------------------ 6 Data
  data.principles:
    doc: tad
    intent: "Modeling choices."
    facts: [data.objects, namespaces, modules.clouds]
    must:
      - "Standard and industry objects first, custom objects for specific needs only."
      - "Lookup versus master-detail policy, external IDs for integrations, configuration in Custom Metadata."
  data.overview:
    doc: tad
    intent: "Explain the overview ERD generated above."
    must:
      - "The central objects and how the domains hang off them (1 to 2 paragraphs)."
    never:
      - "Relationships that are not Lookup or Master-Detail fields."
  data.domains:
    doc: tad
    intent: "One '###' per data domain with its ERD and an object table."
    facts: [data.objects]
    must:
      - "One '### <Domain> {#data-<domainId>}' per domain of the model with objects, then '@@ERD-DOMAIN:<domainId>@@' then a table 'Object | Role | Key fields'."
      - "The lifecycles this section owns (group figures.own): '#### <Object> lifecycle {#lc-<lifecycleId>}' under the domain of the object, then '@@STATE:<lifecycleId>@@' and one sentence per transition with its component. A lifecycle owned by chapter 5 is linked ({{ref:lc-<lifecycleId>}}), never redrawn."
      - "Only objects of the inventory."
  data.industry:
    doc: tad
    when: "modules.industryCloud"
    intent: "Industry cloud objects actually used, and for what."
    facts: [namespaces, data.objects, modules.clouds]
    modules: [industries]
    must:
      - "Table 'Object | Use'. Only objects referenced by the local metadata."
  data.externalIds:
    doc: tad
    when: "fields.externalIds > 0"
    intent: "Role of each external ID: which system feeds it, matching key for upserts."
    must:
      - "One sentence per key family."
  data.recordTypes:
    doc: tad
    when: "recordTypes > 0"
    intent: "Why record types exist and what differs between them."
  data.cmdt:
    doc: tad
    when: "cmdt.types > 0"
    intent: "Which business rules are configured in Custom Metadata (changed without deploying code)."
    facts: [data.cmdtTypes, counts.cmdt]
    must:
      - "Table 'Type | What it configures' — what each type decides for the business, not its fields (the generated table above already lists types and record counts)."
      - "Optional '> [!INTEGRATOR]' callout."
  data.events:
    doc: tad
    when: "modules.events"
    intent: "Platform events and change data capture: publishers and subscribers."
    modules: [platform-events]
  data.dataCloud:
    doc: tad
    when: "modules.dataCloud"
    intent: "Data Cloud: data streams, data model objects, identity resolution, segments and activations used by the CRM."
    modules: [data-cloud]
  data.files:
    doc: tad
    intent: "How documents and files are stored (Salesforce Files, external document store, attachments)."
  data.volumes:
    doc: tad
    when: "org.volumes"
    intent: "Comment the volumetry table (largest objects, growth drivers, large data volume measures), from the org aggregates only."
    never:
      - "Record-level data."
  data.lifecycle:
    doc: tad
    intent: "Creation, update, archiving and deletion of data; history tracking; retention."
    must:
      - "State what is configured (history tracking, archiving jobs, deletion automation); when nothing is configured, say only what is visible — the open question is a finding of the model, not a sentence here."

  # ------------------------------------------------------------------ 7 Application
  application.principles:
    doc: tad
    when: "apex.classes > 0"
    intent: "Apex design principles observed (one trigger per object, handler pattern, selector and service separation, bulkification, user mode)."
    facts: [counts.apex, naming.apex]
  application.layers:
    doc: tad
    when: "apex.classes > 0 || ui.lwc > 0"
    intent: "Code layers and naming conventions."
    facts: [counts.apex.layers, apex.classes]
    must:
      - "Mermaid flowchart TB of the layers (LWC or Flow, controllers, services, selectors, integration) with a Figure caption."
      - "Table 'Layer | Convention | Examples | Count': real class names per layer (from the component cards and naming facts); counts ONLY as placeholders {{n:apex.layers.<layer>}} (controllers, triggerHandlers, services, selectors, async, webServices, invocable, integration, utilities, tests, other), never typed."
    figure: "flowchart TB"
  application.domains:
    doc: tad
    when: "apex.classes > 0"
    intent: "Main classes grouped by functional domain."
    must:
      - "Table 'Domain | Main classes | Role'; at most 6 classes per row, the rest in the appendix ({{ref:annex-apex}})."
  application.triggers:
    doc: tad
    when: "apex.triggers > 0"
    intent: "Trigger framework and order of execution."
    facts: [apex.triggers, signals]
    must:
      - "Table 'Object | Trigger | Handler | Events' (handlers from the graph: trigger delegates to class)."
      - "A '### Order of execution' subsection with a table 'Order | Mechanism | Component | Effect' for every object on which several automations act (before-save flows, before triggers, validation rules, after triggers, after-save flows, asynchronous jobs)."
  application.mechanisms:
    doc: tad
    intent: "The 1 to 3 cross-cutting mechanisms that drive the solution (ownership propagation, rules engine, provisioning...), each with a sequence diagram — or a link ({{ref:fn-<processId>}}) to the chapter 5 figure when the mechanism is a process of the model."
    must:
      - "Name the thresholds and switches visible in code (example: synchronous up to N records, then batch) with the class that implements them (component cards › notes)."
      - "One '> [!INTEGRATOR]' callout per mechanism."
  application.async:
    doc: tad
    when: "apex.batch > 0 || apex.queueable > 0 || apex.schedulable > 0 || apex.future > 0 || org.scheduledJobs"
    intent: "Batch, queueable, schedulable and @future processing."
    facts: [apex.classes, org.scheduledJobs]
    must:
      - "Table 'Job | Type | Started by | Schedule | Purpose' (started by: the caller in the graph — trigger, class, flow — or the scheduled job). The schedule comes from the scheduled jobs of the org or the start of a scheduled flow (brief); a Schedulable class with no job is « can be scheduled », never given a frequency."
      - "Mermaid flowchart of chaining when jobs chain."
  application.flows:
    doc: tad
    when: "flows.total > 0"
    intent: "Role of flows next to Apex, and the main active flows."
    facts: [automation.flows]
    must:
      - "Table 'Flow | Type | Object | Purpose' for the active flows; the full list stays in the appendix ({{ref:annex-automation}})."
  application.omnistudio:
    doc: tad
    when: "omni.scripts > 0 || omni.ips > 0 || omni.dataMappers > 0 || omni.cards > 0"
    intent: "How OmniStudio is used: OmniScripts for guided journeys, Integration Procedures for orchestration, Data Mappers for data access, FlexCards for display."
    facts: [automation.omnistudio]
    modules: [omnistudio]
    must:
      - "Mermaid flowchart OmniScript > Integration Procedure > Data Mapper / Apex / HTTP, then one '###' per family with a table."
  application.ai:
    doc: tad
    when: "modules.agentforce"
    intent: "Agentforce agents, Einstein features and prompt templates: topics, actions, grounding, guardrails, channels."
    modules: [agentforce-ai]
    must:
      - "Table 'Agent or feature | Channel | Topics or use | Actions (Flow, Apex, prompt)'."
  application.sequences:
    doc: tad
    intent: "The technical reading of the key end-to-end sequences: which component calls which, synchronous or not, where the transaction ends."
    must:
      - "Only calls observed in code or metadata; participants named by component."
      - "The processes of the model are drawn once, in chapter 5: link to each with its ref (group figures.link, {{ref:fn-<processId>}}) and add only the technical detail chapter 5 does not give (transaction boundaries, async hand-offs, error handling)."
      - "A hand-drawn sequenceDiagram only for a technical chain that is not a process of the model."
    never:
      - "Participants that are not in the inventory or the glossary."
      - "A '@@SEQ:…@@' directive this section does not own, or the business narrative of chapter 5 repeated."

  # ------------------------------------------------------------------ 8 UI
  ui.apps:
    doc: tad
    intent: "Applications, their audience and navigation (console or standard, utility bar, mobile)."
    facts: [ui.apps]
  ui.pages:
    doc: tad
    when: "ui.flexipages > 0"
    intent: "Key Lightning pages and their composition."
    facts: [ui.flexipages]
    must:
      - "Table 'Page | Object | Custom components'."
      - "Optional composition diagram for the main record page."
  ui.lwc:
    doc: tad
    when: "ui.lwc > 0"
    intent: "LWC organised by domain, with the 2 or 3 key components described."
    facts: [ui.lwc]
    must:
      - "'### By domain' table 'Domain | Components | Role'; the full list is in the appendix ({{ref:annex-lwc}})."
  ui.communication:
    doc: tad
    when: "ui.lwc > 0 || ui.aura > 0"
    intent: "How components talk: events, Lightning Message Service, navigation, wire adapters, Apex."
    facts: [ui.lwc, ui.messageChannels]
  ui.aura:
    doc: tad
    when: "ui.aura > 0"
    intent: "Remaining Aura components and their role (stated neutrally)."
  ui.sites:
    doc: tad
    when: "modules.visualforce || modules.experienceCloud"
    intent: "Experience Cloud sites, public sites and Visualforce pages: audience, templates, authentication, purpose."
    modules: [experience-cloud]
  ui.omnichannel:
    doc: tad
    when: "modules.omniChannel || modules.cti"
    intent: "Telephony (call centers, CTI adapter or Service Cloud Voice) and Omni-Channel routing (channels, queues, skills, capacity), messaging channels."
    facts: [integration.callCenters, misc.signals]
    modules: [service-cloud]

  # ------------------------------------------------------------------ 9 Integrations
  integration.principles:
    doc: tad
    intent: "Integration principles (credentials externalised, the system of record stays master, idempotent upserts with external IDs, asynchronous for volume)."
  integration.patterns:
    doc: tad
    when: "integration.namedCredentials > 0 || integration.externalCredentials > 0 || integration.remoteSites > 0 || integration.externalServices > 0 || integration.restResources > 0 || apex.soap > 0 || apex.callout > 0 || integration.connectedApps > 0 || integration.callCenters > 0"
    intent: "Classify each flow with the Salesforce Integration Patterns."
    must:
      - "Table 'Pattern | Flows' using: Request-Reply, Fire-and-Forget, Batch Data Synchronization, Remote Call-In, UI Update Based on Data Changes, Data Virtualization; flows cited by their FLX-nn id."
  integration.flows:
    doc: tad
    when: "integration.namedCredentials > 0 || integration.externalCredentials > 0 || integration.remoteSites > 0 || integration.externalServices > 0 || integration.restResources > 0 || apex.soap > 0 || apex.callout > 0 || integration.connectedApps > 0 || integration.callCenters > 0"
    intent: "Catalogue of the integration flows."
    must:
      - "Table 'ID | Flow | Direction | System | Salesforce component | Pattern' with FLX-01, FLX-02..., one row per exchange seen in the graph (callouts through named credentials, inbound REST/SOAP, events, Integration Procedures)."
    never:
      - "Systems not in glossary.systems."
      - "Flows that no component implements."
  integration.systems:
    doc: tad
    when: "integration.namedCredentials > 0 || integration.externalCredentials > 0 || integration.remoteSites > 0 || integration.externalServices > 0 || integration.restResources > 0 || apex.soap > 0 || apex.callout > 0 || integration.connectedApps > 0 || integration.callCenters > 0 || systems.named || systems.unnamed"
    intent: "One '###' per connected system, with the sequence of its main exchange."
    facts: [systems, integration.namedCredentials, apex.classes]
    modules: [integration-platforms]
    must:
      - "For each system: purpose, Salesforce endpoints (named credential, authentication), main calls with their Apex class, flow or Integration Procedure."
      - "The exchange of a process of the model is linked with its ref (group figures.link, {{ref:fn-<processId>}}), never redrawn; a hand-drawn sequenceDiagram only for an exchange the model does not hold."
  integration.inbound:
    doc: tad
    when: "integration.restResources > 0 || apex.soap > 0"
    intent: "Exposed APIs (Apex REST or SOAP): callers, payload in one line, security (integration user, permission set, connected app)."
  integration.marketing:
    doc: tad
    when: "modules.marketingCloud || modules.accountEngagement"
    intent: "Marketing integration: Marketing Cloud Connect or Account Engagement (synchronised objects, sends, tracking, consent)."
    modules: [marketing]
  integration.commerce:
    doc: tad
    when: "modules.commerce || modules.orderManagement"
    intent: "Commerce: stores, catalogs, buyer groups, checkout integrations (payment, tax, shipping, inventory) and order management."
    modules: [commerce]
  integration.sso:
    doc: tad
    when: "integration.authProviders > 0 || integration.connectedApps > 0 || modules.experienceCloud"
    intent: "Authentication providers, SSO, registration handlers, connected apps."
    facts: [integration.authProviders, integration.connectedApps]
  integration.domains:
    doc: tad
    when: "integration.remoteSites > 0 || integration.cspTrustedSites > 0 || integration.corsOrigins > 0"
    intent: "Why each allowed domain exists (CSP, CORS, remote sites)."

  # ------------------------------------------------------------------ 10 Security
  security.principles:
    doc: tad
    intent: "Security principles (least privilege, persona-based access, server-side checks, no secrets in code)."
  security.auth:
    doc: tad
    intent: "How users log in and how their access is provisioned (SSO, registration handler, provisioning automation)."
    must:
      - "A sequence diagram when provisioning is automated."
  security.personas:
    doc: tad
    when: "security.permissionSetGroups > 0 || security.permissionSets > 0"
    intent: "Personas and the permission set groups (or, without groups, the permission sets) that implement them."
    facts: [security.permissionSetGroups, security.personas, org.psgAssignments, org.usersByPermissionSet]
    must:
      - "Table 'Persona | Permission set group (or permission set) | Users | Main rights', personas from model.actors and security.personas (field kind says permissionSetGroup or permissionSet), users from the org aggregates (org.psgAssignments, org.usersByPermissionSet) only when org facts exist."
  security.roles:
    doc: tad
    when: "security.roles > 0 && !security.roleHierarchy.sample"
    intent: "Comment the role hierarchy: structure and technical roots."
  security.owd:
    doc: tad
    intent: "Default sharing choices and their rationale."
  security.rules:
    doc: tad
    when: "security.sharingRules > 0 || security.queues > 0"
    intent: "Sharing rules and queues: what they open and to whom."
  security.app:
    doc: tad
    when: "apex.classes > 0"
    intent: "Application security in code: sharing keywords, user mode, FLS and CRUD checks, input validation."
    facts: [counts.apex.withSharing, counts.apex.withoutSharing, apex.classes]
    must:
      - "Neutral facts with placeholders, for example '{{n:apex.withSharing}} classes declare with sharing'."
    never:
      - "Findings phrased as defects: they go to the Improvement Axes."
  security.shield:
    doc: tad
    when: "modules.shield"
    intent: "Shield and compliance capabilities in use: platform encryption, event monitoring, transaction security, field audit trail, data masking."
    modules: [security-shield]
  security.session:
    doc: tad
    intent: "Session and password settings in force."
    facts: [security.session, security.passwordPolicies]
  security.integrationUsers:
    doc: tad
    when: "integration.connectedApps > 0 || integration.namedCredentials > 0 || integration.restResources > 0 || apex.soap > 0"
    intent: "Technical users used by integrations and their permissions."
  security.public:
    doc: tad
    when: "modules.experienceCloud"
    intent: "Guest access and public exposure of sites and APIs."

  # ------------------------------------------------------------------ 11-15
  reporting.reports:
    doc: tad
    intent: "Reporting and dashboards: folders, audiences, KPI components."
  reporting.analytics:
    doc: tad
    when: "modules.crmAnalytics"
    intent: "CRM Analytics or Tableau: apps, dataflows or recipes, datasets, embedding in Lightning pages, security predicates."
    modules: [analytics]
  operations.environments:
    doc: tad
    intent: "Environments (production, sandboxes and their purpose) and their refresh policy."
    never:
      - "Environments not confirmed by the client."
  operations.release:
    doc: tad
    intent: "How a release is prepared and delivered: pipeline, order of deployment, manual steps."
    must:
      - "A sequence or flowchart when the release has phases."
  operations.scheduled:
    doc: tad
    when: "org.scheduledJobs || apex.schedulable > 0 || flows.scheduled > 0"
    intent: "Scheduled processing to monitor in run."
    must:
      - "Only the jobs scheduled in the org (org.scheduledJobs, listed in the brief) and the active scheduled flows, with their frequency as measured; when the org facts were not collected, say which components can be scheduled, never how often they run."
  operations.logging:
    doc: tad
    intent: "Logging, error handling and monitoring."
  operations.tests:
    doc: tad
    when: "apex.classes > 0 || apex.triggers > 0"
    intent: "Test strategy: test classes, data factories, mocks, coverage."
    facts: [counts.apex.tests, org.coverage]
  nfr.measures:
    doc: tad
    intent: "Non-functional requirements and the measures in place."
    must:
      - "Table 'Requirement | Measures in place' (security, performance, volume, availability, maintainability, traceability)."
  nfr.wellArchitected:
    doc: tad
    intent: "Reading of the solution through Salesforce Well-Architected (Trusted, Easy, Adaptable)."
    must:
      - "Table 'Pillar | Practice | Evidence in the org' (Trusted, Easy, Adaptable). Optionally run the platform-architecture-analyze skill first."
    never:
      - "Scores or defects: keep them for the Improvement Axes."
  decisions.adr:
    doc: tad
    intent: "Architecture decisions taken."
    must:
      - "Table 'ID | Domain | Decision | Justification | Consequences' with DA-01, DA-02...; only decisions visible in the metadata or provided by the client."
  outlook.roadmap:
    doc: tad
    intent: "Evolution perspectives, stated positively."
    must:
      - "Bullets; refer to the Improvement Axes document for the detailed register without quoting its findings."

  # ------------------------------------------------------------------ Improvement Axes
  axes.summary:
    doc: axes
    intent: "The 5 most important axes, and the overall health in one paragraph per pillar, from facts.signals and the findings of the understanding model (model.findings)."
    facts: [signals, counts]
  axes.method:
    doc: axes
    intent: "Optional details on how the signals were obtained (Code Analyzer report, Well-Architected skill run, interviews)."
  axes.trusted:
    doc: axes
    intent: "Qualify each Trusted signal: real risk, scope, remediation."
    must:
      - "One paragraph per signal or model finding (kind debt or risk) kept, with its AX-nn reference."
      - "The questions of the model (kind question) that the TAD could not settle, listed as points to confirm with the client."
      - "Products detected on weak evidence only (facts modules.weak: an installed package, a page or a default configuration, but nothing built on it) listed as points to confirm: in use, planned, or to remove."
  axes.easy:
    doc: axes
    intent: "Qualify each Easy signal."
  axes.adaptable:
    doc: axes
    intent: "Qualify each Adaptable signal."
  axes.register:
    doc: axes
    intent: "The register of improvement axes."
    must:
      - "Table 'ID | Axis | Finding | Impact | Recommendation | Priority | Effort' with AX-01..., priority written <span class=\"b p1\">P1</span>; every retained signal and model finding has a row."
  axes.roadmap:
    doc: axes
    intent: "Sequencing of the axes over releases or quarters."
    must:
      - "A Mermaid gantt or a table 'Horizon | Axes'."
