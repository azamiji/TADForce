<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="TADForce">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E88FF"/>
      <stop offset="1" stop-color="#9B1FE8"/>
    </linearGradient>
    <pattern id="grid" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M12 0H0V12" fill="none" stroke="#ffffff" stroke-opacity=".16" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="128" height="128" rx="30" fill="url(#g)"/>
  <rect width="128" height="128" rx="30" fill="url(#grid)"/>
  <!-- blueprint sheet with a folded corner -->
  <path d="M38 20h38l20 20v62a6 6 0 0 1-6 6H38a6 6 0 0 1-6-6V26a6 6 0 0 1 6-6z" fill="#ffffff"/>
  <path d="M76 20v14a6 6 0 0 0 6 6h14z" fill="#D6E4FF"/>
  <!-- the T: crossbar + compass legs -->
  <path d="M44 50h40" stroke="#0B2545" stroke-width="7" stroke-linecap="round"/>
  <path d="M64 52L55 96" stroke="#0B2545" stroke-width="6" stroke-linecap="round"/>
  <path d="M64 52L73 96" stroke="#0B2545" stroke-width="6" stroke-linecap="round"/>
  <circle cx="64" cy="52" r="6.5" fill="#9B1FE8" stroke="#0B2545" stroke-width="3"/>
  <!-- the line the compass draws -->
  <path d="M50 100q14 7 28 0" fill="none" stroke="#9B1FE8" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 5"/>
  <path d="M44 34h18M44 40h12" stroke="#1E88FF" stroke-width="3" stroke-linecap="round" opacity=".55"/>
</svg>
