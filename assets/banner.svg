<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="TADForce — point it at a Salesforce org, get the architecture document a senior architect would write">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071226"/>
      <stop offset="1" stop-color="#140B33"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E88FF"/>
      <stop offset="1" stop-color="#9B1FE8"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5AA9FF"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5AA9FF" stop-opacity="0"/>
      <stop offset=".5" stop-color="#5AA9FF" stop-opacity=".55"/>
      <stop offset="1" stop-color="#5AA9FF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx=".22" cy=".45" r=".6">
      <stop offset="0" stop-color="#3D5AFE" stop-opacity=".35"/>
      <stop offset="1" stop-color="#3D5AFE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#5AA9FF" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
    <pattern id="gridm" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M12 0H0V12" fill="none" stroke="#ffffff" stroke-opacity=".16" stroke-width="1"/>
    </pattern>
    <clipPath id="doc"><rect x="900" y="58" width="300" height="246" rx="14"/></clipPath>
  </defs>

  <rect width="1280" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="24" fill="url(#grid)"/>
  <rect width="1280" height="360" rx="24" fill="url(#glow)"/>

  <!-- mark -->
  <g transform="translate(70 100) scale(1.25)">
    <rect width="128" height="128" rx="30" fill="url(#brand)"/>
    <rect width="128" height="128" rx="30" fill="url(#gridm)"/>
    <path d="M38 20h38l20 20v62a6 6 0 0 1-6 6H38a6 6 0 0 1-6-6V26a6 6 0 0 1 6-6z" fill="#ffffff"/>
    <path d="M76 20v14a6 6 0 0 0 6 6h14z" fill="#D6E4FF"/>
    <path d="M44 50h40" stroke="#0B2545" stroke-width="7" stroke-linecap="round"/>
    <path d="M64 52L55 96" stroke="#0B2545" stroke-width="6" stroke-linecap="round"/>
    <path d="M64 52L73 96" stroke="#0B2545" stroke-width="6" stroke-linecap="round"/>
    <circle cx="64" cy="52" r="6.5" fill="#9B1FE8" stroke="#0B2545" stroke-width="3"/>
    <path d="M50 100q14 7 28 0" fill="none" stroke="#9B1FE8" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 5">
      <animate attributeName="stroke-dashoffset" from="0" to="-28" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- wordmark and tagline -->
  <text x="270" y="170" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="92" font-weight="800" letter-spacing="-2.5">
    <tspan fill="#FFFFFF">TAD</tspan><tspan fill="url(#word)">Force</tspan>
  </text>
  <text x="274" y="214" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="23" fill="#C9D6EA">Point it at a Salesforce org. Get the architecture document</text>
  <text x="274" y="244" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="23" fill="#C9D6EA">a senior architect would write.</text>
  <g font-family="Consolas, SFMono-Regular, Menlo, monospace" font-size="17">
    <rect x="274" y="268" width="376" height="38" rx="9" fill="#0E1E3A" stroke="#2A3F66"/>
    <text x="292" y="293" fill="#7DD3FC">$</text>
    <text x="312" y="293" fill="#E2E8F0">npx tadforce doctor</text>
    <text x="510" y="293" fill="#8B5CF6">→ /tadforce</text>
    <rect x="630" y="279" width="9" height="17" fill="#C084FC">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
  <text x="276" y="336" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="3" fill="#8B9BB8">THE ARCHITECT'S SCRIBE · NO EVIDENCE, NO SENTENCE</text>

  <!-- the document being written -->
  <g>
    <rect x="900" y="58" width="300" height="246" rx="14" fill="#F7F9FC"/>
    <g clip-path="url(#doc)">
      <rect x="900" y="58" width="300" height="6" fill="url(#brand)"/>
      <rect x="922" y="82" width="140" height="12" rx="3" fill="#0B2545"/>
      <rect x="922" y="102" width="220" height="7" rx="3" fill="#B8C4D6"/>
      <rect x="922" y="116" width="190" height="7" rx="3" fill="#B8C4D6"/>
      <g>
        <rect x="922" y="136" width="60" height="44" rx="6" fill="#E8F1FF" stroke="#2F6FE4"/>
        <rect x="992" y="136" width="60" height="44" rx="6" fill="#E8F1FF" stroke="#2F6FE4"/>
        <rect x="1062" y="136" width="60" height="44" rx="6" fill="#E8F1FF" stroke="#2F6FE4"/>
        <rect x="932" y="146" width="22" height="10" rx="2" fill="#0B2545"/>
        <rect x="1002" y="146" width="22" height="10" rx="2" fill="#0B2545"/>
        <rect x="1072" y="146" width="22" height="10" rx="2" fill="#0B2545"/>
      </g>
      <g stroke="#5B6B7D" stroke-width="1.6" fill="none">
        <rect x="922" y="198" width="70" height="30" rx="6" fill="#F1E8FF" stroke="#7B3FE4"/>
        <rect x="1032" y="198" width="70" height="30" rx="6" fill="#E8F1FF" stroke="#2F6FE4"/>
        <rect x="1032" y="248" width="70" height="30" rx="6" fill="#FFF2E2" stroke="#E0861F"/>
        <path d="M992 213H1030M1067 228V246"/>
      </g>
      <rect x="1120" y="198" width="60" height="7" rx="3" fill="#B8C4D6"/>
      <rect x="1120" y="212" width="48" height="7" rx="3" fill="#B8C4D6"/>
      <rect x="1120" y="252" width="56" height="7" rx="3" fill="#B8C4D6"/>
      <rect x="900" y="40" width="300" height="46" fill="url(#scan)">
        <animate attributeName="y" values="40;300;40" dur="5s" repeatCount="indefinite"/>
      </rect>
    </g>
    <rect x="900" y="58" width="300" height="246" rx="14" fill="none" stroke="#2A3F66" stroke-width="1.5"/>
    <g font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="12.5" font-weight="700">
      <rect x="1146" y="44" width="92" height="26" rx="13" fill="#16A34A"/>
      <text x="1192" y="61" text-anchor="middle" fill="#fff">validate 100</text>
    </g>
  </g>
  <g font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#8B9BB8" letter-spacing="1.2">
    <text x="1050" y="330" text-anchor="middle">HTML · PDF · DOCX · REVIEW IN THE BROWSER</text>
  </g>
</svg>
